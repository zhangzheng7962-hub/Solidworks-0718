[project]
name = "solidworks-mcp"
version = "1.0.0"
description = "SOLIDWORKS MCP Server — 让 AI 通过 MCP 协议操控 SOLIDWORKS 参数化建模（10 个基础工具）"
requires-python = ">=3.10"
dependencies = [
    "comtypes>=1.4.16",
    "mcp>=1.0.0",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solidworks_mcp", "src/common"]
